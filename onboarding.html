<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Set up your profile — WAYMARK</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --blue: #245bdb;
      --ink: #15213a;
      --muted: #667085;
      --line: #e5eaf2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: #f7f9fd;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    header {
      padding: 20px 0;
      background: white;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font: 800 22px "Manrope", sans-serif;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--blue);
      border-radius: 12px;
    }

    .setup-card {
      max-width: 690px;
      margin: 40px auto;
      padding: 34px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
    }

    .form-control, .form-select {
      min-height: 48px;
      border-color: var(--line);
      border-radius: 10px;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #245bdb18;
    }

    .btn-primary {
      min-height: 48px;
      background: var(--blue);
      border-color: var(--blue);
      border-radius: 10px;
      font-weight: 700;
    }

    .muted { color: var(--muted); }

    #message { display: none; }

    @media (max-width: 576px) {
      .setup-card {
        margin: 20px 12px;
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <a href="index.html" class="brand">
        <span class="brand-icon"><i data-lucide="compass"></i></span>
        WAYMARK
      </a>
    </div>
  </header>

  <main class="container">
    <section class="setup-card">
      <div class="mb-4">
        <span class="badge text-bg-primary mb-3">STEP 1 OF 1</span>
        <h1 class="h3 fw-bold">Let's personalize your journey.</h1>
        <p class="muted mb-0">
          Tell us where you are in your education. You can update your profile later.
        </p>
      </div>

      <div id="message" class="alert" role="status" aria-live="polite"></div>

      <form id="profile-form">
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Your name</label>
          <input id="name" class="form-control" maxlength="80" required>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label for="stage" class="form-label fw-semibold">Current education stage</label>
            <select id="stage" class="form-select" required>
              <option value="">Select stage</option>
              <option value="school">School student</option>
              <option value="class12">Completed Class 12</option>
              <option value="undergraduate">Undergraduate student</option>
              <option value="graduate">Graduate</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="classLevel" class="form-label fw-semibold">Current class / year</label>
            <select id="classLevel" class="form-select" required>
              <option value="">Select class / year</option>
              <option value="8">Class 8</option>
              <option value="9">Class 9</option>
              <option value="10">Class 10</option>
              <option value="11">Class 11</option>
              <option value="12">Class 12</option>
              <option value="1st-year">College — 1st year</option>
              <option value="2nd-year">College — 2nd year</option>
              <option value="3rd-year">College — 3rd year</option>
              <option value="4th-year">College — 4th year or later</option>
              <option value="completed">Completed studies</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="mt-3 mb-3">
          <label for="stream" class="form-label fw-semibold">Stream / subject area</label>
          <select id="stream" class="form-select" required>
            <option value="">Select an option</option>
            <option value="science">Science</option>
            <option value="commerce">Commerce</option>
            <option value="arts">Arts / Humanities</option>
            <option value="vocational">Vocational</option>
            <option value="general">General / not decided</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="state" class="form-label fw-semibold">State / Union Territory</label>
          <select id="state" class="form-select" required>
            <option value="">Select your state / UT</option>
            <option>Andhra Pradesh</option>
            <option>Arunachal Pradesh</option>
            <option>Assam</option>
            <option>Bihar</option>
            <option>Chhattisgarh</option>
            <option>Goa</option>
            <option>Gujarat</option>
            <option>Haryana</option>
            <option>Himachal Pradesh</option>
            <option>Jharkhand</option>
            <option>Karnataka</option>
            <option>Kerala</option>
            <option>Madhya Pradesh</option>
            <option>Maharashtra</option>
            <option>Manipur</option>
            <option>Meghalaya</option>
            <option>Mizoram</option>
            <option>Nagaland</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Rajasthan</option>
            <option>Sikkim</option>
            <option>Tamil Nadu</option>
            <option>Telangana</option>
            <option>Tripura</option>
            <option>Uttar Pradesh</option>
            <option>Uttarakhand</option>
            <option>West Bengal</option>
            <option>Andaman and Nicobar Islands</option>
            <option>Chandigarh</option>
            <option>Dadra and Nagar Haveli and Daman and Diu</option>
            <option>Delhi</option>
            <option>Jammu and Kashmir</option>
            <option>Ladakh</option>
            <option>Lakshadweep</option>
            <option>Puducherry</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="interests" class="form-label fw-semibold">Your interests</label>
          <textarea
            id="interests"
            class="form-control"
            rows="3"
            maxlength="500"
            placeholder="For example: engineering, medicine, software, design, government exams..."
          ></textarea>
          <div class="form-text">Optional. Don't include passwords or sensitive personal information.</div>
        </div>

        <button id="save-button" class="btn btn-primary w-100" type="submit">
          Save profile and continue <i data-lucide="arrow-right" width="17"></i>
        </button>
      </form>
    </section>
  </main>

  <script type="module">
    import {
      auth,
      persistenceReady,
      requireUser,
      getProfile,
      saveProfile
    } from "./assets/waymark.js";

    const $ = (id) => document.getElementById(id);

    function showMessage(text, type = "danger") {
      const box = $("message");
      box.className = `alert alert-${type}`;
      box.textContent = text;
      box.style.display = "block";
    }

    await persistenceReady;

    const user = await requireUser({ checkOnboarding: false });

    if (user) {
      try {
        const profile = await getProfile(user.uid);

        $("name").value =
          profile?.name ||
          user.displayName ||
          "";

        if (profile) {
          $("stage").value = profile.stage || "";
          $("classLevel").value = profile.classLevel || "";
          $("stream").value = profile.stream || "";
          $("state").value = profile.state || "";
          $("interests").value = profile.interests || "";
        }
      } catch (error) {
        console.error(error);
        showMessage("We couldn't load your saved profile. You can try again.");
      }
    }

    $("profile-form").addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!user) return;

      const button = $("save-button");
      button.disabled = true;
      button.textContent = "Saving profile...";

      try {
        await saveProfile(user.uid, {
          name: $("name").value.trim(),
          stage: $("stage").value,
          classLevel: $("classLevel").value,
          stream: $("stream").value,
          state: $("state").value,
          interests: $("interests").value.trim(),
          onboardingComplete: true,
          email: user.email || null,
          phoneNumber: user.phoneNumber || null
        });

        window.location.replace("dashboard.html");
      } catch (error) {
        console.error(error);
        showMessage("Your profile could not be saved. Check your connection and Firestore rules.");
      } finally {
        button.disabled = false;
        button.innerHTML = 'Save profile and continue <i data-lucide="arrow-right" width="17"></i>';
        lucide.createIcons();
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
