<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Sign in — WAYMARK</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --blue: #245bdb;
      --ink: #15213a;
      --muted: #667085;
      --line: #e5eaf2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #f7f9fd;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: white;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font: 800 23px "Manrope", sans-serif;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      color: white;
      background: var(--blue);
      border-radius: 12px;
    }

    .form-control {
      min-height: 48px;
      border-color: var(--line);
      border-radius: 10px;
    }

    .form-control:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #245bdb18;
    }

    .btn-primary {
      min-height: 48px;
      background: var(--blue);
      border-color: var(--blue);
      border-radius: 10px;
      font-weight: 700;
    }

    .btn-outline-secondary {
      min-height: 48px;
      border-color: var(--line);
      border-radius: 10px;
      font-weight: 700;
    }

    .muted { color: var(--muted); }

    #message {
      display: none;
      overflow-wrap: anywhere;
    }

    #otp-section { display: none; }

    #recaptcha-container {
      display: flex;
      justify-content: center;
      margin: 16px 0;
      overflow-x: auto;
    }

    @media (max-width: 420px) {
      .login-card { padding: 25px 20px; }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <a href="index.html" class="brand">
      <span class="brand-icon"><i data-lucide="compass"></i></span>
      WAYMARK
    </a>

    <h1 class="h3 fw-bold mt-4 mb-2">Welcome back</h1>
    <p class="muted mb-4">Sign in to continue your journey.</p>

    <div id="message" class="alert" role="status" aria-live="polite"></div>

    <button id="google-button" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 mb-4">
      <i data-lucide="chrome" width="19"></i>
      Continue with Google
    </button>

    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="flex-grow-1 border-top"></div>
      <span class="muted small">OR USE YOUR PHONE</span>
      <div class="flex-grow-1 border-top"></div>
    </div>

    <form id="phone-form">
      <label for="phone" class="form-label fw-semibold">Phone number</label>
      <input
        id="phone"
        class="form-control"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="+91 9876543210"
        required
      >

      <p class="small muted mt-2 mb-0">
        Include your country code, such as +91 for India.
      </p>

      <div id="recaptcha-container"></div>

      <button id="send-code" class="btn btn-primary w-100 mt-3" type="submit">
        Send verification code
      </button>
    </form>

    <section id="otp-section" class="mt-4">
      <label for="otp" class="form-label fw-semibold">Verification code</label>
      <input
        id="otp"
        class="form-control"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="Enter SMS code"
      >

      <button id="verify-code" class="btn btn-primary w-100 mt-3" type="button">
        Verify and continue
      </button>
    </section>

    <p class="small muted text-center mt-4 mb-0">
      By continuing, you agree to use WAYMARK responsibly.
      <br><a href="index.html">Back to home</a>
    </p>
  </main>

  <script type="module">
    import {
      auth,
      persistenceReady,
      googleProvider,
      signInWithPopup,
      signInWithPhoneNumber,
      createRecaptcha,
      routeAfterLogin
    } from "./assets/waymark.js";

    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const $ = (id) => document.getElementById(id);

    let confirmationResult = null;
    let verifier = null;
    let busy = false;

    function showMessage(text, type = "danger") {
      const box = $("message");
      box.className = `alert alert-${type}`;
      box.textContent = text;
      box.style.display = "block";
    }

    function errorMessage(error) {
      const messages = {
        "auth/unauthorized-domain": "This domain is not authorized in Firebase. Add your deployed domain in Firebase Authentication settings.",
        "auth/popup-blocked": "The sign-in popup was blocked. Allow popups for this site and try again.",
        "auth/popup-closed-by-user": "The sign-in window was closed before completion.",
        "auth/operation-not-allowed": "This sign-in method is not enabled in Firebase Authentication.",
        "auth/invalid-phone-number": "Enter a valid phone number with its country code.",
        "auth/too-many-requests": "Too many attempts. Please wait before trying again.",
        "auth/invalid-verification-code": "That verification code is incorrect. Please try again.",
        "auth/code-expired": "That verification code has expired. Request a new one.",
        "auth/network-request-failed": "Network error. Check your internet connection and try again.",
        "auth/captcha-check-failed": "reCAPTCHA verification failed. Refresh the page and try again."
      };

      const code = error?.code || "";
      const message = messages[code] || error?.message || "An unexpected error occurred.";
      showMessage(`${message}${code ? ` (${code})` : ""}`);
    }

    async function runBusy(button, task) {
      if (busy) return;

      busy = true;
      button.disabled = true;

      try {
        await task();
      } catch (error) {
        console.error(error);
        errorMessage(error);
      } finally {
        busy = false;
        button.disabled = false;
      }
    }

    await persistenceReady;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      try {
        await routeAfterLogin(user);
      } catch (error) {
        console.error(error);
        showMessage("Signed in, but we couldn't load your student profile. Please try again.");
      }
    });

    $("google-button").addEventListener("click", () => {
      runBusy($("google-button"), async () => {
        await signInWithPopup(auth, googleProvider);
      });
    });

    $("phone-form").addEventListener("submit", (event) => {
      event.preventDefault();

      runBusy($("send-code"), async () => {
        const phone = $("phone").value.trim();

        if (!/^\+[1-9]\d{7,14}$/.test(phone.replace(/\s/g, ""))) {
          throw new Error("Enter a valid phone number with its country code, for example +919876543210.");
        }

        if (verifier) {
          verifier.clear();
          verifier = null;
        }

        verifier = createRecaptcha("recaptcha-container");

        confirmationResult = await signInWithPhoneNumber(
          auth,
          phone.replace(/\s/g, ""),
          verifier
        );

        $("otp-section").style.display = "block";
        $("otp").focus();

        showMessage("Verification code sent. Check your SMS messages.", "success");
      });
    });

    $("verify-code").addEventListener("click", () => {
      runBusy($("verify-code"), async () => {
        const code = $("otp").value.trim();

        if (!confirmationResult) {
          throw new Error("Request a verification code first.");
        }

        if (!/^\d{6}$/.test(code)) {
          throw new Error("Enter the six-digit verification code.");
        }

        await confirmationResult.confirm(code);
      });
    });

    lucide.createIcons();
  </script>
</body>
</html>
